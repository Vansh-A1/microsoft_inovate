name: Governed pilot release
on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Verified full commit SHA
        required: true
      approval_file:
        description: Private approval path on the approved runner
        required: true
      rollback:
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: enterprise-pilot
  cancel-in-progress: false
jobs:
  deployment:
    environment: enterprise-pilot
    runs-on: [self-hosted, ap-private-pilot]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.release_commit }}', persist-credentials: false}
      - name: Explicit account, budget, identity, network and recovery gate
        env:
          APPROVAL_FILE: ${{ inputs.approval_file }}
        run: |
          test -f "$APPROVAL_FILE"
          .venv/bin/python scripts/release/deployment_gate.py "$APPROVAL_FILE"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Reviewed image release or image rollback
        env:
          APPROVAL_FILE: ${{ inputs.approval_file }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          ROLLBACK: ${{ inputs.rollback }}
          AP_RELEASE_PARAMETERS: ${{ vars.AP_RELEASE_PARAMETERS }}
          AP_RESOURCE_GROUP: ${{ vars.AP_RESOURCE_GROUP }}
        run: |
          .venv/bin/python scripts/release/pilot_dispatch.py
